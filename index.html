<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数字孪生 v3.0 - 视频与3D模型融合实操台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #ui-bar {
      position: fixed; top: 16px; left: 16px; z-index: 10; width: 325px;
      max-height: calc(100vh - 32px); overflow-y: auto;
      background: rgba(18, 22, 28, 0.88); color: #e2e8f0;
      padding: 14px 16px; border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px); font-size: 12px; line-height: 1.6;
    }
    #ui-bar h3 { font-size: 15px; color: #38bdf8; margin-bottom: 6px; }
    .section { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.12); }
    .file-row { margin-top: 6px; }
    .file-row label { display: block; color: #94a3b8; margin-bottom: 2px; }
    input[type="file"], select, input[type="text"] {
      width: 100%; font-size: 11px; color: #e2e8f0;
      background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 4px; padding: 4px 6px;
    }
    input[type="file"] { border: none; background: transparent; padding: 0; }
    .checkbox-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; color: #cbd5e1; }
    #picker-list {
      max-height: 92px; overflow-y: auto; font-family: monospace;
      color: #fde047; margin: 6px 0; background: rgba(0, 0, 0, 0.35); padding: 6px; border-radius: 4px;
    }
    .btn-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    button {
      padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer;
      background: #0284c7; color: #fff; font-size: 12px;
    }
    button:hover { background: #0369a1; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #334155; }
    #status-bar { margin-top: 10px; color: #4ade80; font-family: monospace; font-size: 11px; }
    #alarm-banner {
      display: none; position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 20; background: rgba(220, 38, 38, 0.92); color: #fff;
      padding: 10px 22px; border-radius: 6px; font-weight: 600; font-size: 14px;
      box-shadow: 0 4px 20px rgba(220, 38, 38, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.85; } to { opacity: 1; } }

    #calib-modal {
      display: none; position: fixed; inset: 0; z-index: 30;
      background: rgba(2, 6, 23, 0.82); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 20px;
    }
    .calib-dialog {
      width: min(920px, 95vw); background: #0f172a; color: #e2e8f0;
      border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 10px; padding: 16px;
    }
    .calib-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .calib-header h4 { color: #38bdf8; font-size: 15px; }
    #calib-canvas {
      width: 100%; aspect-ratio: 16 / 9; background: #020617;
      border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 6px; cursor: crosshair; display: block;
    }
    #calib-summary { margin: 8px 0; font-family: monospace; font-size: 12px; color: #fde047; }
  </style>
</head>
<body>
  <div id="alarm-banner">电子围栏越界告警</div>

  <div id="ui-bar">
    <h3>数字孪生 v3.0 视频融合实操台</h3>
    <div style="color:#94a3b8">左键旋转 | 右键平移 | 滚轮缩放</div>

    <div class="section">
      <div class="file-row">
        <label>练习 1：选择目标监控并接入本地视频 / 远程流</label>
        <select id="stream-cam-select"></select>
      </div>
      <div class="file-row">
        <input type="file" id="video-upload" accept="video/*" />
      </div>
      <div class="file-row">
        <input type="text" id="stream-url-input" placeholder="输入 MP4 / .m3u8 / WHEP 地址" />
        <div class="btn-row">
          <button id="btn-bind-stream">接入流地址</button>
          <button id="btn-reset-canvas" class="secondary">恢复测试画布</button>
        </div>
      </div>

      <div class="file-row">
        <label>练习 5：上传自定义 GLB 模型（支持离线 Draco）</label>
        <input type="file" id="glb-upload" accept=".glb,.gltf" />
        <label class="checkbox-row">
          <input type="checkbox" id="glb-auto-center" checked />
          上传后自动居中落底并适配视角
        </label>
      </div>
      <div class="file-row">
        <label>练习 4：热重载相机配置 JSON</label>
        <input type="file" id="json-upload" accept=".json" />
      </div>
    </div>

    <div class="section">
      <div><strong>练习 4：3D 控制点采集 &amp; Web 标定</strong> (<kbd>Shift</kbd> + 左键)</div>
      <div id="picker-list">尚未采点（建议采集 6 个以上不共面的点）</div>
      <div class="btn-row">
        <button id="btn-open-calib">Web 2D/3D 标定台</button>
        <button id="btn-copy-pts" class="secondary">复制 Python 数组</button>
        <button id="btn-undo-pt" class="secondary">撤销</button>
        <button id="btn-clear-pts" class="secondary">清空</button>
      </div>
    </div>

    <div id="status-bar">正在初始化监控槽位...</div>
  </div>

  <div id="calib-modal">
    <div class="calib-dialog">
      <div class="calib-header">
        <h4>Web 端 2D/3D 联合标定台（RANSAC + LM 求解）</h4>
        <button id="btn-close-calib" class="secondary">关闭</button>
      </div>
      <canvas id="calib-canvas" width="960" height="540"></canvas>
      <div id="calib-summary">当前相机: - | 3D 点: 0 个 | 2D 点: 0 个</div>
      <div class="btn-row" style="align-items: center;">
        <button id="btn-calib-capture" class="secondary">抓取当前视频帧</button>
        <label style="font-size:12px;color:#cbd5e1;cursor:pointer;">
          上传参考图 <input type="file" id="calib-img-upload" accept="image/*" style="width:160px;" />
        </label>
        <button id="btn-calib-undo" class="secondary">撤销 2D 点</button>
        <button id="btn-calib-clear" class="secondary">清空 2D 点</button>
        <button id="btn-calib-solve">前端求解并应用外参</button>
        <button id="btn-calib-export" class="secondary">导出标定配点 JSON</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
